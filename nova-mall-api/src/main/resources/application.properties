server.port=28019
spring.datasource.name=novamall-datasource
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/novamall_db?useUnicode=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&autoReconnect=true&useSSL=false&allowMultiQueries=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=hikariCP
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1
# mybatis config
mybatis.mapper-locations=classpath:mapper/*Mapper.xml

# redis config
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.database=0
spring.redis.timeout=5000
# 热点数据缓存开关：无 Redis 的环境置为 false 即可关闭缓存正常运行
novamall.cache.enabled=true
# 订单支付超时时间(分钟)，超时未支付的订单会被定时任务自动取消并回补库存
novamall.order.pay-timeout-minutes=30

# AI 商品助手配置：enabled=false 或未配置 api-key 时接口自动降级为模板化内容，不影响商品详情访问
# 敏感配置通过环境变量注入（NOVAMALL_AI_ENABLED / NOVAMALL_AI_API_KEY），不要把真实 key 提交到仓库
novamall.ai.enabled=${NOVAMALL_AI_ENABLED:false}
novamall.ai.base-url=https://api.deepseek.com
novamall.ai.api-key=${NOVAMALL_AI_API_KEY:}
novamall.ai.model=deepseek-chat
novamall.ai.timeout-seconds=30

# logging.level.com.novamall.api.dao=debug